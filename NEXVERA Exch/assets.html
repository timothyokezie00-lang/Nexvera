<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient('https://bximlwzpjiypajqcanse.supabase.co','sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV');
  async function loadAssets(){
    const { data:{ user } } = await supabaseClient.auth.getUser();
    if(!user) return;
    // NAME: 1. Try Auth metadata (where signup name lives) 2. Try profiles 3. Fallback to email
let displayName = user.user_metadata?.full_name || user.user_metadata?.name || user.user_metadata?.username || user.user_metadata?.display_name;
if (!displayName) {
  let { data: prof1 } = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
  let prof = prof1;
  if (!prof) {
    let r2 = await supabaseClient.from('profiles').select('*').eq('user_id', user.id).maybeSingle();
    prof = r2.data;
  }
  if (prof) displayName = prof.full_name || prof.username || prof.name || prof.email;
}
if (!displayName) displayName = user.email.split('@')[0];
document.getElementById('userName').textContent = displayName;

    let { data: rows } = await supabaseClient.from('balances').select('amount, account_type').eq('user_id', user.id);
    let funding=0, trading=0;
    (rows||[]).forEach(r=>{ if((r.account_type||'').toLowerCase()==='funding') funding+=Number(r.amount||0); if((r.account_type||'').toLowerCase()==='trading') trading+=Number(r.amount||0); });
    let total=funding+trading;
    let fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2});
    document.getElementById('totalAssets').textContent=fmt(total);
    document.getElementById('fundingBal').textContent=fmt(funding);
    document.getElementById('tradingBal').textContent=fmt(trading);
    document.getElementById('usdtBal').textContent=fmt(total);
    // TODAY'S P&L - SAME FORMULA AS dashboard.html
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let { data: txs } = await supabaseClient.from('transactions').select('amount').eq('user_id', user.id).eq('type', 'reward').gte('created_at', today.toISOString());
    let pnl = 0;
    if (txs) txs.forEach(r => pnl += Number(r.amount || 0));
    const startingBalance = total - pnl;
    const percent = startingBalance > 0 ? (pnl / startingBalance * 100) : 0;
    const sign = pnl >= 0 ? '+' : '';
    document.getElementById('pnlValue').textContent = sign + pnl.toFixed(2);
    document.getElementById('pnlPct').textContent = `(${sign}${percent.toFixed(2)}%)`;
    const pnlColor = pnl >= 0 ? '#00D26A' : '#FF3B30';
    document.getElementById('pnlValue').style.color = pnlColor;
    document.getElementById('pnlPct').style.color = pnlColor;
  }
  loadAssets();
</script>
