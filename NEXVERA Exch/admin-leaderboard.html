<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{ background:#0a0f1e; color:#fff; font-family:sans-serif; padding:14px; }
  .card{ background:#111a2e; border:1px solid #26314d; border-radius:14px; padding:14px; margin-bottom:14px; }
  input{ width:100%; background:#0a0f1e; border:1px solid #26314d; color:#fff; padding:10px; border-radius:8px; margin:4px 0 10px; box-sizing:border-box; }
  label{ font-size:12px; color:#94a3b8; font-weight:700; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn{ border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; }
  .btn-save{ background:#facc15; color:#000; }
  .btn-sort{ background:#22c55e; color:#000; }
  .btn-sort:disabled{ opacity:0.6; }
  .item{ background:#0a0f1e; border:1px solid #26314d; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .medal{ font-size:20px; }
  #sortStatus{ margin-top:10px; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<a style="color:white;" href="admin_bot.html">← Back</a>
<h2>🏆 Admin - Leaderboard</h2>
<p style="color:#94a3b8; font-size:13px;">Add fake / real top traders here. Users see them on Trade page instantly. Use masked names like John M.</p>

<div class="card">
  <h3 id="formTitle">+ Add Trader</h3>
  <input type="hidden" id="editId">
  <label>Display Name * (e.g. John M.)</label>
  <input id="f_name" placeholder="John M.">
  <div class="row">
    <div><label>Rank Position * (1 = Top)</label><input id="f_rank" type="number" value="1"></div>
    <div><label>Profit $ *</label><input id="f_profit" type="number" value="1250"></div>
  </div>
  <div class="row">
    <div><label>Bot Name</label><input id="f_bot" placeholder="BTC MASTER"></div>
    <div><label>Win Rate %</label><input id="f_win" type="number" value="94"></div>
  </div>
  <label>Total Invested $</label>
  <input id="f_total" type="number" value="5000">
  <button class="btn btn-save" onclick="saveRow()">💾 SAVE</button>
  <button class="btn" style="background:#1e293b; color:#fff; margin-top:8px;" onclick="clearForm()">Clear</button>
</div>

<div class="card" style="text-align:center;">
  <button class="btn btn-sort" id="sortBtn">🔽 Arrange Leaderboard by Profit ↓<br><span style="font-size:12px; font-weight:400;">Highest Profit = #1 • Lowest = Last • One tap, done</span></button>
  <div id="sortStatus" style="color:#facc15;"></div>
  <p style="color:#94a3b8; font-size:12px; margin:8px 0 0;">Example: Jacob $7,383,929 → #1, Peter $4,332,089 → #2, Ada $526,262 → #3</p>
</div>

<h3>Leaderboard (<span id="count">0</span>) • <span id="sortLabel" style="color:#facc15; font-size:13px;">Sorted by Rank</span></h3>
<div id="list">Loading...</div>

<script>
const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
const SUPABASE_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
load();
document.getElementById('sortBtn').addEventListener('click', sortByProfit);

async function load(){
  const { data, error } = await sb.from('leaderboard').select('*').order('rank_position', {ascending:true}).order('profit', {ascending:false});
  if(error){ document.getElementById('list').innerHTML = 'Error: '+error.message; return; }
  document.getElementById('count').textContent = data.length;
  if(!document.getElementById('editId').value){
    document.getElementById('f_rank').value = data.length + 1;
  }
  document.getElementById('list').innerHTML = data.map((r, i) => {
    const pos = i + 1;
    const medal = pos==1?'🥇':pos==2?'🥈':pos==3?'🥉':'#'+pos;
    return `<div class="item"><div><span class="medal">${medal}</span> <b>${r.display_name}</b> • ${r.bot_name||''}<br><span style="color:#94a3b8; font-size:12px;">Profit $${Number(r.profit).toLocaleString()} • Win ${r.win_rate}% • Invested $${Number(r.total_invested).toLocaleString()}</span></div><div style="display:flex; gap:6px;"><button onclick="editRow('${r.id}')" style="background:#1e293b; color:#fff; border:none; padding:8px; border-radius:8px;">Edit</button><button onclick="delRow('${r.id}')" style="background:#7f1d1d; color:#fff; border:none; padding:8px; border-radius:8px;">Del</button></div></div>`;
  }).join('') || 'No entries yet';
}

async function editRow(id){
  const { data } = await sb.from('leaderboard').select('*').eq('id', id).single();
  document.getElementById('editId').value = data.id;
  document.getElementById('f_name').value = data.display_name;
  document.getElementById('f_rank').value = data.rank_position;
  document.getElementById('f_profit').value = data.profit;
  document.getElementById('f_bot').value = data.bot_name||'';
  document.getElementById('f_win').value = data.win_rate;
  document.getElementById('f_total').value = data.total_invested;
  document.getElementById('formTitle').textContent = '✏️ Editing: '+data.display_name;
  window.scrollTo({top:0, behavior:'smooth'});
}

// ===== SORT - NO confirm/alert, shows status, fallback delete+insert =====
async function sortByProfit(){
  const btn = document.getElementById('sortBtn');
  const st = document.getElementById('sortStatus');
  try{
    btn.disabled = true;
    st.style.color = '#facc15'; st.textContent = '⏳ Loading traders...';
    const { data, error } = await sb.from('leaderboard').select('*').order('profit', {ascending:false});
    if(error) throw new Error('Load failed: ' + error.message);
    if(!data || data.length===0){ st.textContent = 'No traders yet'; btn.disabled = false; return; }
    st.textContent = '⏳ Found ' + data.length + ' traders. Sorting by profit... Highest: ' + data[0].display_name + ' $' + Number(data[0].profit).toLocaleString();

    // TRY 1: update with offset to avoid collision
    let updateFailed = null;
    for(let i=0;i<data.length;i++){
      const r = await sb.from('leaderboard').update({ rank_position: 1000 + i }).eq('id', data[i].id);
      if(r.error){ updateFailed = r.error.message; break; }
    }
    if(!updateFailed){
      for(let i=0;i<data.length;i++){
        const r = await sb.from('leaderboard').update({ rank_position: i + 1 }).eq('id', data[i].id);
        if(r.error){ updateFailed = r.error.message; break; }
      }
    }

    // TRY 2: if update is blocked by RLS / policy, delete + re-insert
    if(updateFailed){
      st.style.color = '#f59e0b'; st.textContent = '⚠️ Update blocked (' + updateFailed + '). Trying delete + re-insert...';
      const sorted = data.map((d,i)=> ({ display_name: d.display_name, rank_position: i+1, profit: d.profit, bot_name: d.bot_name, win_rate: d.win_rate, total_invested: d.total_invested, is_active: true }));
      const del = await sb.from('leaderboard').delete().neq('id', '00000000-0000-0000-0000-000000000000');
      if(del.error) throw new Error('Delete failed (RLS?): ' + del.error.message);
      const ins = await sb.from('leaderboard').insert(sorted);
      if(ins.error) throw new Error('Re-insert failed: ' + ins.error.message);
    }

    document.getElementById('sortLabel').textContent = 'Sorted by Profit ↓';
    st.style.color = '#22c55e';
    st.textContent = '✅ Done! ' + data.map((d,i)=> '#'+(i+1)+' '+d.display_name+' $'+Number(d.profit).toLocaleString()).join(' | ');
    await load();
  }catch(e){
    st.style.color = '#ef4444';
    st.textContent = '❌ FAILED: ' + e.message + ' — Screenshot this and send to me. Fix is in Supabase Policies.';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

async function saveRow(){
  const payload = { display_name: document.getElementById('f_name').value.trim(), rank_position: Number(document.getElementById('f_rank').value) || 1, profit: Number(document.getElementById('f_profit').value), bot_name: document.getElementById('f_bot').value.trim(), win_rate: Number(document.getElementById('f_win').value), total_invested: Number(document.getElementById('f_total').value), is_active: true };
  if(!payload.display_name) return alert('Name required');
  if(payload.rank_position < 1) payload.rank_position = 1;
  const id = document.getElementById('editId').value;
  const res = id ? await sb.from('leaderboard').update(payload).eq('id', id) : await sb.from('leaderboard').insert([payload]);
  if(res.error) return alert(res.error.message);
  clearForm(); load();
}
function clearForm(){ document.getElementById('editId').value=''; document.getElementById('formTitle').textContent='+ Add Trader'; document.getElementById('f_name').value=''; document.getElementById('f_profit').value=0; document.getElementById('f_bot').value=''; document.getElementById('f_win').value=0; document.getElementById('f_total').value=0; }
async function delRow(id){ if(!confirm('Delete?')) return; await sb.from('leaderboard').delete().eq('id', id); load(); }
</script>
</body>
</html>
