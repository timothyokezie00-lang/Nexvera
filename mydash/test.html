<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; background: #f2f2f2; padding: 20px; }
  .market-box { background: white; border-radius: 15px; padding: 15px; }
  .coin-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
  .left { display: flex; align-items: center; gap: 10px; }
  .icon { width: 36px; height: 36px; border-radius: 50%; }
  .names { display: flex; flex-direction: column; gap: 2px; }
  .symbol { color: gray; font-size: 13px; text-transform: uppercase; }
  .price { font-weight: bold; }
  .change { font-size: 14px; }
  .green { color: #16c784; }
  .red { color: #ea3943; }
</style>
</head>
<body>

<div class="market-box">
  <h3>Market prices</h3>
  <div id="coins">Loading live prices...</div>
</div>

<script>
async function loadCoins() {
  try {
    const url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum';
    const res = await fetch(url);
    const data = await res.json();

    let html = '';
    data.forEach(coin => {
      const isUp = coin.price_change_percentage_24h >= 0;
      html += `
        <div class="coin-row">
          <div class="left">
            <img src="${coin.image}" class="icon">
            <div class="names">
              <span>${coin.name}</span>
              <span class="symbol">${coin.symbol}</span>
            </div>
          </div>
          <div>
            <div class="price">$${coin.current_price.toLocaleString()}</div>
            <div class="change ${isUp ? 'green' : 'red'}">${isUp ? '+' : ''}${coin.price_change_percentage_24h.toFixed(2)}%</div>
          </div>
        </div>
      `;
    });
    document.getElementById('coins').innerHTML = html;
  } catch (e) {
    document.getElementById('coins').innerHTML = 'No internet - check data';
  }
}

loadCoins();
setInterval(loadCoins, 30000); // refresh every 30 seconds
</script>



<!-- TradingView Chart -->
<div style="height:400px;" id="tradingview_chart"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  "width": "100%",
  "height": 400,
  "symbol": "BINANCE:BTCUSDT",
  "interval": "D",
  "timezone": "Etc/UTC",
  "theme": "light",
  "style": "1", /* 1 = candlestick, 2 = line */
  "locale": "en",
  "container_id": "tradingview_chart"
});
</script>

</body>
</html>
