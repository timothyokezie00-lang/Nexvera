<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexvera - Verify Email</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:black;min-height:100dvh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1A1A1A;width:100%;max-width:400px;border-radius:20px;padding:28px;position:relative; border: 1px solid #222}
.logo{text-align:center;font-size:28px;font-weight:900;color:white;margin-bottom:6px}
.sub{text-align:center;color: white;font-size:14px;margin-bottom:22px}
label{font-size:13px;font-weight:700;color: #fff;display:block;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#6366f1}
.row{display:flex;gap:8px}
.row input{flex:1}
.btn-otp{background: #6366f1;color:white;border:none;padding:13px 14px;border-radius:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.btn-next{width:100%;background:#6366f1;color:white;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:800;margin-top:22px;cursor:pointer}
.btn-next:active{opacity:0.8; box-shadow: 5px 5px 5px;}
#msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px;color:#dc2626;font-weight:600}
#debug{text-align:center;font-size:11px;color:#64748b;margin-top:8px}

/* Custom Select */
.custom-select{position:relative;width:100%}
.select-btn{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;background:white;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#0f172a}
.select-btn span{color:#64748b}
.select-btn span.selected{color:#0f172a}
.dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:white;border:2px solid #e2e8f0;border-radius:12px;margin-top:6px;z-index:99;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
.dropdown.open{display:block}
.search-box{padding:10px;border-bottom:1px solid #e2e8f0}
.search-box input{border:1px solid #e2e8f0;padding:10px}
.country-list{max-height:240px;overflow-y:auto}
.country-item{padding:12px 14px;cursor:pointer;font-size:15px}
.country-item:hover{background:#eef2ff}
.country-item.hidden{display:none}
.no-result{padding:12px;text-align:center;color:#64748b;font-size:13px;display:none}
.backwards{
  text-decoration: underline;
  color: white;
  
}
.backwards:hover{
  color: yellow;
  font-size: 20px;
}



  html, body{
    margin: 0; padding: 0;
    min-height: 100dvh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container, .signup_container, .card {
    margin: auto !important;
    width: 100%;
  }

</style>
</head>
<body>
<div class="card">
  <div style="margin-top: -15px; margin-left: -15px;">
    <a class="backwards" href="index.html">back</a>
  </div>
<div class="logo">Nexvera</div>
<div class="sub">Verify your email to continue</div>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" value="">

<label>OTP Code</label>
<div class="row">
<input type="text" id="otp" placeholder="Input OTP" inputmode="numeric" maxlength="8">
<button class="btn-otp" id="otpBtn" onclick="requestOtp()">Request Otp</button>
</div>

<label>Country</label>
<div class="custom-select" id="countrySelect">
  <div class="select-btn" onclick="toggleDropdown()"><span id="selectedCountry">Select Country</span><span>▼</span></div>
  <div class="dropdown" id="dropdown">
    <div class="search-box">
      <input type="text" id="countrySearch" placeholder="Search country..." oninput="filterCountries()" autocomplete="off">
    </div>
    <div class="country-list" id="countryList"></div>
    <div class="no-result" id="noResult">No country found</div>
  </div>
</div>

<button class="btn-next" id="nextBtn" onclick="verifyAndGo()">Next →</button>
<div id="msg"></div>
<div id="debug"></div>
</div>

<script>
const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const countries = ["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cambodia","Cameroon","Canada","Cape Verde","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czech Republic","Democratic Republic of the Congo","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];

let selectedCountryValue = "";

const listEl = document.getElementById('countryList');
countries.forEach(c => {
  const div = document.createElement('div');
  div.className = 'country-item';
  div.innerText = c;
  div.onclick = () => selectCountry(c);
  listEl.appendChild(div);
});

function toggleDropdown(){
  const dd = document.getElementById('dropdown');
  dd.classList.toggle('open');
  if(dd.classList.contains('open')){
    document.getElementById('countrySearch').value = "";
    filterCountries();
    setTimeout(()=> document.getElementById('countrySearch').focus(), 50);
  }
}
function filterCountries(){
  const q = document.getElementById('countrySearch').value.toLowerCase();
  let shown = 0;
  document.querySelectorAll('.country-item').forEach(item => {
    const match = item.innerText.toLowerCase().includes(q);
    item.classList.toggle('hidden', !match);
    if(match) shown++;
  });
  document.getElementById('noResult').style.display = shown === 0 ? 'block' : 'none';
}
function selectCountry(c){
  selectedCountryValue = c;
  const label = document.getElementById('selectedCountry');
  label.innerText = c;
  label.classList.add('selected');
  document.getElementById('dropdown').classList.remove('open');
}
document.addEventListener('click', (e) => {
  if(!document.getElementById('countrySelect').contains(e.target)){
    document.getElementById('dropdown').classList.remove('open');
  }
});

function showMsg(t){ document.getElementById('msg').innerText = t; }
function showDebug(t){ document.getElementById('debug').innerText = t; }

async function requestOtp(){
  const email = document.getElementById('email').value.trim();
  if(!email){ showMsg("Enter your email first"); return; }
  const btn = document.getElementById('otpBtn');
  btn.innerText = "Sending..."; btn.disabled = true;
  showMsg("Sending code...");
  const { error } = await supabaseClient.auth.signInWithOtp({ email: email, options:{ shouldCreateUser:true } });
  if(error){ showMsg("Error: " + error.message); btn.innerText="Request Otp"; btn.disabled=false; return; }
  showMsg("Code sent! Check your Gmail");
  btn.innerText = "Resend Code";
  btn.disabled = false;
  showDebug("Code sent to " + email);
}

async function verifyAndGo(){
  showMsg("");
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const country = selectedCountryValue;
  showDebug("Tapped Next - Email: "+email+" OTP: "+otp+" Country: "+country);

  if(!email){ showMsg("Enter email first"); return; }
  if(otp.length !== 8){ showMsg("Enter the full 8-digit code"); return; }
  if(!country){ showMsg("Select your country first"); return; }

  const btn = document.getElementById('nextBtn');
  btn.innerText = "Verifying..."; btn.disabled = true;
  showMsg("Verifying code, please wait...");

  const { data, error } = await supabaseClient.auth.verifyOtp({ email: email, token: otp, type: 'email' });

  if(error){
    showMsg("Wrong code: " + error.message + " - Request a NEW code");
    btn.innerText = "Next →"; btn.disabled = false;
    return;
  }

  localStorage.setItem('nexvera_email', email);
  localStorage.setItem('nexvera_country', country);
  showMsg("Verified! Going to signup...");
  window.location.href = "signup.html";
}
</script>
</body>
</html>
