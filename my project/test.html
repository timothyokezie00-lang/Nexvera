<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body{
      background:black; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
    }
    .input{
      text-align: center;
      color: white; background-color: #18181b; width: 90%; max-width: 400px; border: 1px solid #2a2a2a ; background: #18181b; padding: 60px 60px; border-radius: 12px;
    }
    .divider{
      width: 250%; border: 1px solid white; max-width: 250px; margin: 0 auto 40px auto;
    }
    .done{
      color: orange; background: black; border-radius: 20px; border: 1px solid gray; padding: 5px 5px;
    }
    .none{
     background-color: black; border-radius: 12px; border:1px solid gray ; color: white; width: 40%;
    }
    .all{
      background-color: black; border-radius: 12px; border:1px solid gray ; color: white; width: 40%;
    }
    .submit{
      background: orange; color: black; border-radius: 12px; border: 1px solid orange; width: 250px; padding: 5px 5px; font-size: 20px; font-weight: bold;
    }
   .back{
     background-color: #18181b; color: white; font-weight: bold; border:1px solid #18181b;
   }
   .text{
     color: gray; font-size: 10px; font-family: Arial, Helvetica, sans-serif;
   }
   .signup{
     color: white;  }
   .my{
    width: 235px; padding: 4px 4px;
     }
   .nd{
     width: 235px; padding: 4px 4px;
   }
   .welcome{
     font-family: Arial, Helvetica, sans-serif;
   }
   .continue{
     font-family: Arial, Helvetica, sans-serif; font-size: 10px;
   }
   .box{
     display: flex; justify-content: flex-start; align-items: center; gap: 8px; width: 100%; margin: 12px 0; text-align: left;
     font-family: Arial, Helvetica, sans-serif; font-size: 10px;
   }
   
   .remember-row {
     font-size: 13px;
  display: flex !important;
  flex-direction: row !important;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  width: 100%;
  margin: 10px 0 20px 0; font-family: Arial, Helvetica, sans-serif;
}

.remember-row input[type="checkbox"] {
  width: 16px !important;
  height: 16px !important;
  margin: 0 !important;
}

.remember-row label {
  margin: 0;
  font-size: 13px;
}
.forgotten-password{
  .forget-top {
  display: block;
  text-align: right;
  margin-top: 6px;
  margin-bottom: 10px;
  font-size: 0.85rem;
  color: #f0d000; /* your yellow */
  align-self: flex-end;
}
}

  </style>
    
  
</head>

<body>
 <div class="input">
   <button class="back" type="button">back</button>
   
    <h2 class="welcome">Welcome back</h2> 
    <p class="continue">sign in to continue with your account</p>
 
   <form >
     <label for="name"> <br /></label>
     <input class="my" type="text" name="name" id="name" value="" minlength="5"  placeholder="enter name"/><br />
     
     
     
     <label for="password"> <br /></label>
     <input class="nd" type="password" name="password" id="password" value="" placeholder="enter password" minlength="10" c/>
     <div class="remember-row">
       <input type="checkbox" id="remember">
       <a class="forgotten-password" href="">forget password</a>
     
       <label for="remember">remember me</label>
     </div>
   
    
     <br />
     
     
     <br />
     <button class="submit"type="submit">login</button>
     
   </form> <br />
   <div class="divider">
     
   </div>
       

         <div>
           <p class="text">do not have an account?<a class="signup" href="#">signup</a></p>
         </div>
         
       
       <button class="all" type="help">help</button>
      
       
    

     
 </div>
</body>

</html>
