<script>
let allCoins = [];
async function loadMarket(){
  try{
    let url = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1';
    let res = await fetch(url);
    let data = await res.json();
    allCoins = data;
    showCoins(allCoins);
  }catch(e){
    document.getElementById('list').innerHTML = 'Network error - check internet';
  }
}
function showCoins(coins){
  let html = '';
  coins.forEach(c => {
    let change = c.price_change_percentage_24h || 0;
    let isUp = change >= 0;
    let priceText = c.current_price < 1 ? c.current_price.toFixed(4) : c.current_price.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
    html += '<div class="row"><div class="left"><img class="coin-img" src="' + c.image + '"><div><div class="sym">' + c.symbol + ' / USDT</div><div class="sub">' + c.name + '</div></div></div><div><div class="price">$' + priceText + '</div><div class="' + (isUp?'up':'down') + '" style="text-align:right;">' + (isUp?'+':'') + change.toFixed(2) + '%</div></div></div>';
  });
  document.getElementById('list').innerHTML = html;
}
function filterCoins(){
  let q = document.getElementById('search').value.toLowerCase();
  let filtered = allCoins.filter(c => c.symbol.includes(q) || c.name.toLowerCase().includes(q));
  showCoins(filtered);
}
loadMarket();
setInterval(loadMarket, 30000);
</script>
