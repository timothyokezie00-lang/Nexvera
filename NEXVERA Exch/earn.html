<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient('https://bximlwzpjiypajqcanse.supabase.co', 'sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV');
  const claimBtn = document.getElementById('claimBtn');

  // ===== LOAD EARN PRODUCTS FROM ADMIN - ACTIVE = PURPLE, INACTIVE = GREY =====
  async function loadEarnProducts(){
    const el = document.getElementById('earnList');
    const { data, error } = await supabaseClient.from('earn_products').select('*').eq('is_active', true).order('sort_order', {ascending:true}).order('created_at', {ascending:true});
    if(error){ el.innerHTML = '<p style="text-align:center;color:#ef4444;padding:20px;">Error: '+error.message+'</p>'; return; }
    if(!data || !data.length){ el.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:20px;">No earn products yet. Check back soon.</p>'; return; }
    el.innerHTML = data.map(p => {
      const btnActive = p.button_active !== false;
      const btnStyle = btnActive ? 'background:#7c3aed !important; color:#fff !important; opacity:1; cursor:pointer;' : 'background:#334155 !important; color:#94a3b8 !important; opacity:0.7; cursor:not-allowed;';
      const btnAction = btnActive ? `onclick="openSubscribe('${(p.title||'').replace(/'/g,"\\'")}', '${(p.apy||'').replace(/'/g,"\\'")}')"` : 'disabled';
      return `
      <div class="earn-card" data-type="${p.type || 'flexible'}">
        <div class="coin ${p.coin_class || 'usdt'}">${p.coin_symbol || '₮'}</div>
        <div class="earn-info"><b>${p.title}</b><small>${p.subtitle || ''}</small></div>
        <div class="earn-right"><span class="apy">${p.apy || ''}</span><small>${p.detail || ''}</small><button class="earn-btn" style="${btnStyle}" ${btnAction}>${p.button_text || 'Subscribe'}</button></div>
      </div>`;
    }).join('');
  }
  function openSubscribe(title, apy){
    try{ smartsupp('chat:open'); setTimeout(function(){ smartsupp('chat:message', "I want to subscribe to " + title + " (" + apy + ")"); }, 800); }catch(e){}
    alert("You selected " + title + " - " + apy + "\nChat with Support to subscribe.");
  }
  loadEarnProducts();
  // ===== END LOAD =====

  function makeGrey(){
    claimBtn.textContent = "Claimed ✓";
    claimBtn.disabled = true;
    claimBtn.style.background = "#334155";
    claimBtn.style.color = "#94a3b8";
  }

  function bonusKey(uid){
    return 'nexvera_bonus_claimed_' + uid;
  }

  async function getCurrentUid(){
    try{
      const { data: { user } } = await supabaseClient.auth.getUser();
      return user ? user.id : null;
    }catch(e){ return null; }
  }

  (async function(){
    let uid = await getCurrentUid();
    if(uid && localStorage.getItem(bonusKey(uid)) === 'yes'){
      makeGrey();
    }
  })();

  async function claimBonus(){
    let uid = await getCurrentUid();
    if(uid && localStorage.getItem(bonusKey(uid)) === 'yes'){
      return;
    }
    try{
      smartsupp('chat:open');
      setTimeout(function(){
        smartsupp('chat:message', "I am requesting for new user bonus");
      }, 1000);
    }catch(e){}
    if(uid){
      localStorage.setItem(bonusKey(uid), 'yes');
    } else {
      localStorage.setItem('nexvera_bonus_claimed', 'yes');
    }
    makeGrey();
  }
</script>
