<body><div class="container">
<div class="back" style="margin-top:48px!important;padding-top:12px!important;margin-right:0!important"><a class="b_ack" href="coin_options.html" style="margin-top:0!important">← back</a></div>
<h2 style="text-align:center;">Deposit Ethereum</h2>
<p style="text-align:center; color:#facc15; font-size:12px;">Ethereum (ERC20) Network ONLY</p>
<div style="background:#111a2e; padding:16px; border-radius:14px; margin-top:12px; text-align:center;">
<div style="background:#fff; padding:10px; border-radius:12px; display:inline-block;"><img id="depositQR" src="" style="width:160px; height:160px; display:block;"></div>
<div id="depositAddress" style="background:#0a0f1e; border:1px solid #26314d; border-radius:10px; padding:12px; margin:14px 0; word-break:break-all; color:#fff; font-size:14px;">0x9921B47780F92e9fEFCb662E318b66E37991848e</div>
<button onclick="copyDepositAddress()" style="background:#1e293b; color:#fff; border:none; padding:12px 20px; border-radius:20px; font-weight:700; width:100%; cursor:pointer;">📋 Copy Address</button>
<p style="color:#FFB800; font-size:12px; margin-top:12px;">⚠️ Send ONLY ETH on Ethereum Network. Sending another coin or network will lose your funds.</p>
<button onclick="messageSupport()" style="background:#facc15; color:#000; border:none; padding:12px; border-radius:10px; font-weight:700; width:100%; margin-top:8px;">I Have Sent</button>
<p id="copyToast" style="display:none; color:#22c55e; font-size:13px; font-weight:700; margin-top:10px;">✓ Address Copied!</p>
</div></div>
<script>
const ETH_ADDRESS="0x9921B47780F92e9fEFCb662E318b66E37991848e";
document.getElementById('depositAddress').textContent=ETH_ADDRESS;
document.getElementById('depositQR').src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data="+ETH_ADDRESS;
async function copyDepositAddress(){const addr=document.getElementById('depositAddress').textContent.trim();try{await navigator.clipboard.writeText(addr)}catch(e){const ta=document.createElement('textarea');ta.value=addr;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}const toast=document.getElementById('copyToast');toast.style.display='block';setTimeout(function(){toast.style.display='none'},2000)}
function messageSupport(){let msg="Hello, I have paid to your ETH address "+ETH_ADDRESS+" on Ethereum (ERC20). Please confirm my deposit.";if(window.smartsupp){smartsupp('chat:open')}let tries=0;let timer=setInterval(function(){tries++;try{if(window.smartsupp){smartsupp('chat:message',msg);clearInterval(timer)}}catch(e){}if(tries>5)clearInterval(timer)},800)}
</script>
