<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: white;
      min-height: 100vh;
      width: 100%;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .logo{
      font-family: arial;
      font-weight: bold;
      font-size: 24px;
      height: 38px;
      width: 38px;
      text-align: center;
      line-height: 38px;
      border-radius: 50%;
      background-color: blue;
      color: white;
      margin-bottom: 25px;
    }
    h1{
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 25px;
      color: #0A0B0D;
    }
    .inpu{
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .inpu input{
      width: 100%;
      height: 56px;
      background-color: white;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 16px;
      
    }
    .inpu input:focus{
      border: 2px solid #0052FF;
    }
    .pass-wrap{
      position: relative;
    }
    .pass-wrap span{
      position: absolute;
      right: 16px;
      top: 18px;
      color: gray;
    }
    #pass{ width: 100%; }

    .checks{
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 15px;
      color: #5B616E;
    }
    .checks div{
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tick{
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #D1D5DB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .tick.ok{
      background: #059669;
      color: white;
      border-color: #059669;
    }

    .done{
      margin-top: auto;
      padding-top: 30px;
      width: 100%;
    }
    .terms{
      display: flex;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .terms a{ color: #0052FF; text-decoration: none; }
    
    .butt{
      width: 100%;
      height: 56px;
      background: #0052FF;
      color: white;
      border: none;
      border-radius: 28px;
      font-size: 17px;
      font-weight: 600;
    }
    .butt:disabled{
      background: #B1B5C0;
    }
  </style>
</head>
<body>
  <div class="logo">C</div>
  <h1>Create an account</h1>

  <div class="inpu">
     <input type="text" id="name" placeholder="First Name" />
     <input type="text" id="lname" placeholder="Last Name" />
     <input type="email" id="gmail" placeholder="Email" />
     <div class="pass-wrap">
       <input type="password" id="pass" placeholder="Password" />
       <span>👁️</span>
     </div>
  </div>

  <div class="checks">
    <div><div class="tick" id="c1">✓</div> At least 8 characters</div>
    <div><div class="tick" id="c2">✓</div> Includes a number</div>
    <div><div class="tick" id="c3">✓</div> Includes lowercase letter</div>
    <div><div class="tick" id="c4">✓</div> Includes uppercase letter</div>
  </div>

  <div class="done">
    <div class="terms">
      <input type="checkbox" id="box1" />
      <label for="box1">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>
    <button class="butt" id="btn" disabled>Create free account</button>
  </div>

<script>
  const pass = document.getElementById('pass');
  pass.addEventListener('input', () => {
    const v = pass.value;
    document.getElementById('c1').classList.toggle('ok', v.length >= 8);
    document.getElementById('c2').classList.toggle('ok', /[0-9]/.test(v));
    document.getElementById('c3').classList.toggle('ok', /[a-z]/.test(v));
    document.getElementById('c4').classList.toggle('ok', /[A-Z]/.test(v));
  });
</script>
</body>
</html>
