<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>this is timothy </h1>
  
  <script>
  const supabaseUrl = 'PASTE_YOUR_URL_HERE'
  const supabaseKey = 'PASTE_YOUR_ANON_KEY_HERE'
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)
  
  async function makeDeposit() {
    const tx = document.getElementById('txInput').value
    const amount = document.getElementById('amountInput').value
    const { error } = await supabase.from('deposits').insert([{ tx_hash: tx, amount: amount }])
    if (error) alert(error.message)
    else alert('Deposit saved!')
  }
</script>
</body>

</html>
