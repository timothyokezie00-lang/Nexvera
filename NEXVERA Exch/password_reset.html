<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <link rel="stylesheet" href="Css/style_login.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="general">
      <h1 style="color:white; text-align:center;">Reset Password</h1>
      <p style="color:#aaa; text-align:center; font-size:13px;">Enter the code sent to your email</p>

      <!-- STEP 1: ENTER CODE -->
      <div id="codeStep">
        <input class="pwd" type="text" id="resetCode" placeholder="Enter 6-digit code" inputmode="numeric" style="width:100%; margin-top:15px;" />
        <div id="codeStatus" style="color:yellow; text-align:center; margin-top:10px; font-size:13px;"></div>
        <div class="login-btn" style="margin-top:15px;">
          <button id="verifyCodeBtn" style="width:100%;">Verify Code</button>
        </div>
        <p style="text-align:center; margin-top:10px; font-size:12px;"><a href="#" id="resendCode" style="color:#4da3ff;">Resend code</a></p>
      </div>

      <!-- STEP 2: NEW PASSWORD - hidden until code is correct -->
      <div id="passStep" style="display:none;">
        <p style="color:#aaa; text-align:center; font-size:13px;">Enter your new password</p>
        <input class="pwd" type="password" id="newPass" placeholder="New password" style="width:100%; margin-top:15px;" />
        <input class="pwd" type="password" id="confirmPass" placeholder="Confirm new password" style="width:100%; margin-top:10px;" />
        <div id="status" style="color:yellow; text-align:center; margin-top:10px; font-size:13px;"></div>
        <div class="login-btn" style="margin-top:15px;">
          <button id="resetBtn" style="width:100%;">Save New Password</button>
        </div>
      </div>

      <p style="text-align:center; margin-top:15px;"><a href="login.html" style="color:#4da3ff;">Back to Login</a></p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const resetEmail = (localStorage.getItem('nexvera_reset_email') || '').toLowerCase().trim();

    // --- STEP 1: VERIFY CODE ---
    document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
      const codeStatus = document.getElementById('codeStatus');
      const code = document.getElementById('resetCode').value.trim();
      if (!resetEmail) { codeStatus.textContent = "No email found. Go back to Login and tap Forgot password again."; return; }
      if (!code) { codeStatus.textContent = "Enter the code from your email"; return; }
      codeStatus.textContent = "Verifying...";
      const { error } = await supabaseClient.auth.verifyOtp({
        email: resetEmail,
        token: code,
        type: 'recovery'
      });
      if (error) { codeStatus.textContent = "ERROR: " + error.message; return; }
      // Code correct - show password step
      codeStatus.textContent = "Code correct!";
      document.getElementById('codeStep').style.display = 'none';
      document.getElementById('passStep').style.display = 'block';
    });

    // Resend code
    document.getElementById('resendCode').addEventListener('click', async (e) => {
      e.preventDefault();
      const codeStatus = document.getElementById('codeStatus');
      if (!resetEmail) { codeStatus.textContent = "No email found."; return; }
      codeStatus.textContent = "Resending...";
      const { error } = await supabaseClient.auth.signInWithOtp({ email: resetEmail, options: { shouldCreateUser: false } });
      codeStatus.textContent = error ? "ERROR: " + error.message : "New code sent! Check your email.";
    });

    // --- STEP 2: SAVE NEW PASSWORD - same as your old code ---
    document.getElementById('resetBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      const p1 = document.getElementById('newPass').value;
      const p2 = document.getElementById('confirmPass').value;
      if (p1 !== p2) { status.textContent = "Passwords do not match"; return; }
      if (p1.length < 6) { status.textContent = "Password must be at least 6 characters"; return; }
      status.textContent = "Saving...";
      const { error } = await supabaseClient.auth.updateUser({ password: p1 });
      if (error) { status.textContent = "ERROR: " + error.message; }
      else { status.textContent = "SUCCESS! Redirecting to login..."; localStorage.removeItem('nexvera_reset_email'); setTimeout(() => window.location.href = "login.html", 1200); }
    });
  </script>
</body>
</html>
