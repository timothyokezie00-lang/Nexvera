async function loadM10(){try{let url='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=true';let res=await fetch(url);let data=await res.json();let html='';data.forEach((c,i)=>{let ch=c.price_change_percentage_24h||0;let up=ch>=0;let p=c.current_price<1?c.current_price.toFixed(4):c.current_price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222;">'+'<div style="display:flex;gap:10px;align-items:center;"><img src="'+c.image+'" style="width:32px;height:32px;border-radius:50%;"><div><div style="font-weight:bold;font-size:14px;text-transform:uppercase;color:#fff;">'+c.symbol+' / USDT</div><div style="color:#888;font-size:12px;">'+c.name+'</div></div></div>'+'<div><canvas id="m10c'+i+'" width="70" height="30"></canvas></div>'+'<div><div style="font-weight:bold;font-size:14px;text-align:right;color:#fff;">$'+p+'</div><div style="text-align:right;font-size:13px;color:'+(up?'#00D26A':'#FF3B30')+';">'+(up?'+':'')+ch.toFixed(2)+'%</div></div>'+'</div>'});document.getElementById('m10').innerHTML=html;data.forEach((c,i)=>{let cv=document.getElementById('m10c'+i);if(!cv||!c.sparkline_in_7d)return;let pr=c.sparkline_in_7d.price;let ctx=cv.getContext('2d');let min=Math.min.apply(null,pr);let max=Math.max.apply(null,pr);if(max===min)max=min+1;ctx.beginPath();ctx.strokeStyle=c.price_change_percentage_24h>=0?'#00D26A':'#FF3B30';ctx.lineWidth=1.5;for(let k=0;k<pr.length;k++){let x=(k/(pr.length-1))*70;let y=30-((pr[k]-min)/(max-min))*30;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()})}catch(e){document.getElementById('m10').innerHTML='Network error'}}loadM10();setInterval(loadM10,60000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient('https://bximlwzpjiypajqcanse.supabase.co','sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV');
async function doBlockedLogout(){try{await supabaseClient.auth.signOut()}catch(e){}window.location.href='login.html'}
async function loadDashboardBalance(){try{const{data:{user}}=await supabaseClient.auth.getUser();if(!user){document.getElementById('totalBalance').textContent="NO LOGIN";return}let{data:st}=await supabaseClient.from('user_status').select('status').eq('user_id',user.id).maybeSingle();if(st&&st.status!=='active'){let box=document.getElementById('blockedBox');if(st.status==='deleted'){document.getElementById('blockedTitle').textContent='Account Deleted';document.getElementById('blockedMsg').textContent='This account has been deleted. Please contact support if you think this is a mistake.'}else{document.getElementById('blockedTitle').textContent='Account Suspended';document.getElementById('blockedMsg').textContent='Your account has been suspended. Please contact support.'}box.style.display='block';return}let displayName=user.user_metadata?.full_name||user.user_metadata?.name||user.user_metadata?.username;if(!displayName){let{data:prof}=await supabaseClient.from('profiles').select('*').eq('id',user.id).maybeSingle();if(prof)displayName=prof.full_name||prof.username||prof.name}if(!displayName)displayName=user.email.split('@')[0];document.getElementById('userName').textContent=displayName;let res2=await supabaseClient.from('balances').select('amount, account_type').eq('user_id',user.id);let rows=res2.data;let error=res2.error;if(error){document.getElementById('totalBalance').textContent="ERR: "+error.message;return}let total=0;if(rows)rows.forEach(r=>{total+=Number(r.amount||0)});document.getElementById('totalBalance').textContent=total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const today=new Date();today.setHours(0,0,0,0);let{data:txs}=await supabaseClient.from('transactions').select('amount').eq('user_id',user.id).eq('type','reward').gte('created_at',today.toISOString());let pnl=0;if(txs)txs.forEach(r=>pnl+=Number(r.amount||0));const startingBalance=total-pnl;const percent=startingBalance>0?(pnl/startingBalance*100):0;const sign=pnl>=0?'+':'';document.getElementById('todayPnl').textContent=sign+pnl.toFixed(2);document.getElementById('todayPnlPercent').textContent='('+sign+percent.toFixed(2)+'%)';const color=pnl>=0?'#00D26A':'#FF3B30';document.getElementById('todayPnl').style.color=color;document.getElementById('todayPnlPercent').style.color=color}catch(e){document.getElementById('totalBalance').textContent="ERR: "+e.message}}
loadDashboardBalance();
</script>
