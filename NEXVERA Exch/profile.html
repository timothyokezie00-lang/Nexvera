<script>
// --- USE SAME SUPABASE KEYS AS dashboard.html ---
const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
const SUPABASE_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadProfile() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }

  // Name + UID - real, not hardcoded Timothy
  let name = user.user_metadata?.full_name || user.user_metadata?.name || user.user_metadata?.username || user.email.split('@')[0];
  document.getElementById('profileName').textContent = name;
  document.getElementById('profileUid').textContent = user.id.slice(0, 8); // short UID

  // HISTORY - all fund movements
  let { data: txs, error } = await supabaseClient.from('transactions')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false })
    .limit(30);

  const box = document.getElementById('historyList');
  if (error) { box.innerHTML = '<p style="text-align:center;color:#FF3B30;padding:16px;">ERR: ' + error.message + '</p>'; return; }
  if (!txs || txs.length === 0) {
    box.innerHTML = '<p style="text-align:center; color:#888; padding:16px;">No fund movements yet</p>';
    return;
  }

  let html = '';
  txs.forEach(t => {
    let label = t.note || t.detail || t.title || t.type;

    const isOut = t.type === 'withdraw' || t.direction === 'out';
    const sign = isOut ? '-' : '+';
    const amountColor = isOut ? '#FF3B30' : '#00D26A';

    const status = (t.status || 'completed').toLowerCase();
    let statusColor = '#00D26A', statusText = 'Successful';
    if (status === 'pending') { statusColor = '#FFB800'; statusText = 'Pending'; }
    if (status === 'failed' || status === 'rejected') { statusColor = '#FF3B30'; statusText = 'Failed'; }

    const d = new Date(t.created_at);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    html += `
      <div class="history-row">
        <div class="history-left">
          <div class="history-title">${label}</div>
          <div class="history-date">${dateStr}</div>
        </div>
        <div class="history-right">
          <div class="history-amount" style="color:${amountColor}">${sign}${Math.abs(Number(t.amount)).toFixed(2)} USDT</div>
          <div class="history-status" style="color:${statusColor}">● ${statusText}</div>
        </div>
      </div>`;
  });
  box.innerHTML = html;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
});

loadProfile();
</script>
