<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXVERA - Notifications</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{background:#000;color:#fff;padding:16px;padding-bottom:30px}
  a{text-decoration:none;color:inherit}

  /* TOP BAR */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .back{font-size:28px;font-weight:300;line-height:1}
  .topbar h2{font-size:19px;font-weight:800}
  .topbar span{margin-left:auto;font-size:13px;color:#f59e0b;font-weight:700}

  /* TABS */
  .tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 16px;border-radius:20px;background:#141414;color:#888;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid #222}
  .tab.active{background:#fff;color:#000;border-color:#fff}

  /* NOTIFICATION LIST */
  .notif{background:#111;border:1px solid #232323;border-radius:18px;padding:16px;display:flex;gap:12px;margin-bottom:12px;position:relative}
  .notif.unread{background:#151515;border-color:#2a2a2a}
  .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .icon.green{background:rgba(34,197,94,.15)}
  .icon.gold{background:rgba(245,158,11,.15)}
  .icon.blue{background:rgba(59,130,246,.15)}
  .icon.red{background:rgba(239,68,68,.15)}
  .icon.purple{background:rgba(168,85,247,.15)}
  .content{flex:1;min-width:0}
  .content h4{font-size:14px;font-weight:700;line-height:1.4}
  .content p{font-size:13px;color:#888;line-height:1.5;margin-top:4px}
  .time{font-size:11px;color:#666;white-space:nowrap;margin-top:2px}
  .dot{width:8px;height:8px;background:#ef4444;border-radius:50%;position:absolute;top:16px;right:16px}
  .btn{margin-top:10px;background:#fff;color:#000;border:none;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800}
  .btn-outline{margin-top:10px;background:transparent;color:#fff;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700}

  /* EMPTY / FOOTER */
  .footer{text-align:center;color:#555;font-size:12px;margin-top:24px;padding-bottom:16px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="dashboard.html"><div class="back">←</div></a>
  <h2>Notifications</h2>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active">All</div>
</div>

<!-- ALL NOTIFICATIONS GO HERE - WELCOME + ADMIN -->
<div id="notifList"></div>

<div class="footer">No more notifications • NEXVERA</div>

<!-- SUPABASE - SAME AS YOUR OTHER PAGES -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
const SUPABASE_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function formatDate(dateObj){
  return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function timeAgo(dateObj){
  let diff = Date.now() - dateObj.getTime();
  let mins = Math.floor(diff / 60000);
  if(mins < 1) return "Just now";
  if(mins < 60) return mins + " mins ago";
  let hours = Math.floor(mins / 60);
  if(hours < 24) return hours + " hours ago";
  let days = Math.floor(hours / 24);
  if(days === 1) return "Yesterday";
  if(days < 30) return days + " days ago";
  let months = Math.floor(days / 30);
  return months + " months ago";
}

function iconFor(type){
  if(type === 'success') return ['green','✅'];
  if(type === 'gold' || type === 'reward') return ['gold','🎉'];
  if(type === 'warning') return ['red','⚠️'];
  if(type === 'promo') return ['purple','🎁'];
  return ['blue','🔔'];
}

async function loadAll(){
  let list = document.getElementById('notifList');

  // Get current logged-in user ID - for Specific User notifications
  let myUserId = null;
  try{
    let { data } = await supabaseClient.auth.getSession();
    if(data && data.session && data.session.user) myUserId = data.session.user.id;
  }catch(e){}

  // 1. SIGNUP DATE - same logic as before
  let signupDate = null;
  let saved = localStorage.getItem('nexvera_signup_date') 
           || localStorage.getItem('nexvera_user_created') 
           || localStorage.getItem('signup_date');
  if(saved) signupDate = new Date(saved);
  if(!signupDate){
    try{
      let { data } = await supabaseClient.auth.getSession();
      if(data && data.session && data.session.user && data.session.user.created_at){
        signupDate = new Date(data.session.user.created_at);
        localStorage.setItem('nexvera_signup_date', signupDate.toISOString());
      }
    }catch(e){}
  }
  if(!signupDate){
    signupDate = new Date();
    localStorage.setItem('nexvera_signup_date', signupDate.toISOString());
  }

  // 2. WELCOME CARD - same as your old design
  let html = `
  <div class="notif unread">
    <div class="icon gold">🎉</div>
    <div class="content">
      <h4>Welcome to NEXVERA!</h4>
      <p>Your account has been successfully created. You can now deposit, trade, and start earning on NEXVERA. Explore the market to begin your journey.</p>
      <p style="color:#f59e0b;font-weight:700;margin-top:8px;font-size:12px;">Account created on ${formatDate(signupDate)}</p>
    </div>
    <div class="time">${timeAgo(signupDate)}</div>
    <div class="dot"></div>
  </div>`;

  // 3. ADMIN NOTIFICATIONS - from Supabase
  let { data: notifs } = await supabaseClient
    .from('notifications')
    .select('*')
    .order('created_at', { ascending: false });

  if(notifs){
    notifs.forEach(n => {
      // If this notification is for a specific user, hide it from others
      if(n.user_id && n.user_id !== myUserId) return;
      let [color, emoji] = iconFor(n.type);
      let d = new Date(n.created_at);
      html += `
      <div class="notif unread">
        <div class="icon ${color}">${emoji}</div>
        <div class="content">
          <h4>${n.title}</h4>
          <p>${n.message}</p>
        </div>
        <div class="time">${timeAgo(d)}</div>
        <div class="dot"></div>
      </div>`;
    });
  }

  list.innerHTML = html;
}

loadAll();
</script>
