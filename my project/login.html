<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#151515;padding:40px 25px;border-radius:20px;width:90%;max-width:380px;text-align:center}
h2{font-size:36px;margin:0 0 10px 0;text-transform:lowercase}
.sub{color:#aaa;font-size:14px;margin-bottom:25px}
input{width:100%;padding:14px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:15px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:20px;color:#aaa}
.row a{color:#F5A623;text-decoration:none}
.btn{width:100%;padding:14px;background:#F5A623;border:none;border-radius:10px;font-weight:700;font-size:16px}
.bottom{margin-top:20px;font-size:13px;color:#aaa}
.bottom a{color:#F5A623}
</style>
</head>
<body>
<div class="card">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
  <path d="M6 8a6 6 0 0 1 12 0c0 7 6 5 6 10H0s6-3 6-10" />
  <path d="M10 21a2 2 0 0 0 4 0" />
</svg>
  <h2>welcome back</h2>
  <div class="sub">Sign in to continue to your account</div>
  <input type="email" placeholder="email@company.com">
  <input type="password" placeholder="Enter your password">
  <div class="row"><label><input type="checkbox" style="width:auto"> Remember me</label> <a href="#">Forgot password?</a></div>
  <a href="dashboard/index.html"><button class="btn">Log in</button></a>
  <div class="bottom">Don't have an account? <a href="signup.html">Sign up</a></div>
</div>
</body>
</html>
