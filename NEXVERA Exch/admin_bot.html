<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Manage Bots</title>

<script>
  if (!localStorage.getItem('nexvera_admin')) window.location.href = 'admin-login.html';
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{ background:#0a0f1e; color:#fff; font-family:sans-serif; padding:14px; }
  .card{ background:#111a2e; border:1px solid #26314d; border-radius:14px; padding:14px; margin-bottom:14px; }
  input, textarea, select{ width:100%; background:#0a0f1e; border:1px solid #26314d; color:#fff; padding:10px; border-radius:8px; margin:4px 0 10px; box-sizing:border-box; }
  label{ font-size:12px; color:#94a3b8; font-weight:700; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn{ border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; }
  .btn-save{ background:#facc15; color:#000; }
  .btn-edit{ background:#1e293b; color:#fff; padding:8px; }
  .btn-del{ background:#7f1d1d; color:#fff; padding:8px; }
  .btn-toggle{ background:#14532d; color:#fff; padding:8px; }
  .bot-item{ background:#0a0f1e; border:1px solid #26314d; border-radius:12px; padding:12px; margin-bottom:10px; }
  .bot-item b{ font-size:16px; }
  .bot-item span{ font-size:12px; color:#94a3b8; }
  

  
</style>
</head>
<body>
  
  <a style="color: white;" href="admin.html">back</a>
  <a href="admin-leaderboard.html" style="display:block; background:#22c55e; color:#000; padding:12px; border-radius:10px; font-weight:700; text-align:center; text-decoration:none; margin:10px 0;">🏆 Open Leaderboard</a>

<h2>🤖 Admin - Manage Bots</h2>
<p id="debug" style="background:#7f1d1d; padding:10px; border-radius:8px; display:none;"></p>
<p style="color:#94a3b8; font-size:13px;">Edit ANYTHING here. Users see it instantly.</p>

<!-- ===== DISCONNECT USER - TOP ===== -->
<h3 style="margin-top:6px;">👥 Connected Users (<span id="connCount">0</span>)</h3>
<p style="color:#94a3b8; font-size:13px;">Users connected to a bot. Tap Disconnect to remove them from that bot.</p>
<div id="connList">Loading connections...</div>

<div class="card" style="margin-top:14px;">
  <h3 style="margin:0 0 10px;">🔌 Manually Disconnect User</h3>
  <label>User ID</label>
  <input id="manualUserId" placeholder="Paste User ID here">
  <label>Bot ID (optional - leave blank to disconnect from ALL bots)</label>
  <input id="manualBotId" placeholder="Paste Bot ID or leave blank">
  <button class="btn" style="background:#ef4444; color:#fff;" onclick="manualDisconnect()">Disconnect User</button>
  <p id="manualMsg" style="color:#22c55e; display:none; font-weight:700; margin-top:8px;"></p>
</div>
<!-- ===== END DISCONNECT - TOP ===== -->

<div class="card">
  <h3 id="formTitle">+ Add New Bot</h3>
  <input type="hidden" id="editId">

  <label>Bot Name *</label>
  <input id="f_name" value="BTC MASTER">

  <div class="row">
    <div><label>Username</label><input id="f_username" value="@nexvera_pro"></div>
    <div><label>Badge (TOP / NEW / HOT or blank)</label><input id="f_badge" value="TOP"></div>
  </div>

  <label>Description</label>
  <textarea id="f_description" rows="2">Long-term BTC swing trading. Holds positions for 3 to 7 days. Safe for beginners.</textarea>

  <div class="row">
    <div><label>Fee %</label><input id="f_fee" type="number" value="5"></div>
    <div><label>Investors</label><input id="f_investors" type="number" value="2500"></div>
  </div>

  <div class="row">
    <div><label>Max Drawdown %</label><input id="f_drawdown" value="-8.2%"></div>
    <div><label>Risk</label><input id="f_risk" value="LOW RISK"></div>
  </div>

  <div class="row">
    <div><label>Own Funds $</label><input id="f_own" type="number" value="91245"></div>
    <div><label>Min Investment $ *</label><input id="f_min" type="number" value="50"></div>
  </div>

  <div class="row">
    <div><label>Total Invested $</label><input id="f_total" type="number" value="1250000"></div>
    <div><label>Return 6M</label><input id="f_return" value="+124%"></div>
  </div>

  <div class="row">
    <div><label>Win Rate %</label><input id="f_win" type="number" value="94"></div>
    <div><label>Followers</label><input id="f_followers" type="number" value="3102"></div>
  </div>

  <label>Provider ID Code *</label>
  <input id="f_provider" value="NEX-8821">

  <label>Active?</label>
  <select id="f_active">
    <option value="true">✅ ACTIVE - Show to users</option>
    <option value="false">❌ HIDDEN - Hide from users</option>
  </select>

  <button class="btn btn-save" onclick="saveBot()">💾 SAVE BOT</button>
  <button class="btn" style="background:#1e293b; color:#fff; margin-top:8px;" onclick="clearForm()">Clear / Add New</button>
  <p id="saveMsg" style="color:#22c55e; display:none; font-weight:700;">✓ Saved!</p>
</div>

<h3>All Bots (<span id="botCount">0</span>)</h3>
<div id="botList">Loading...</div>

<script>
const SUPABASE_URL = "https://bximlwzpjiypajqcanse.supabase.co";
const SUPABASE_KEY = "sb_publishable_xZOu-PA9_U5izK5wyPnJaA_8cG_pjnV";

function showDebug(msg){
  const el = document.getElementById('debug');
  el.style.display = 'block';
  el.textContent = msg;
}

if(!window.supabase){
  showDebug("ERROR: Supabase library did not load. Check internet / CDN blocked. Reload page.");
  document.getElementById('botList').innerHTML = "Supabase library failed to load.";
} else {
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  loadBots();
  loadConnections();
}

async function loadBots(){
  try{
    const { data, error } = await sb.from('bots').select('*').order('created_at', {ascending:false});
    if(error){ document.getElementById('botList').innerHTML = "Error: "+error.message; showDebug("Supabase Error: "+error.message + " - Did you run the RLS policies?"); return; }
    document.getElementById('botCount').textContent = data.length;
    if(data.length === 0){
      document.getElementById('botList').innerHTML = "No bots yet. Fill the form above and click SAVE BOT.";
      return;
    }
    document.getElementById('botList').innerHTML = data.map(b => `
      <div class="bot-item">
        <b>${b.name}</b> ${b.badge ? `<span style="background:#7c3aed; color:#fff; padding:2px 8px; border-radius:20px; font-size:11px;">${b.badge}</span>` : ''} 
        ${b.is_active ? '<span style="color:#22c55e;">● ACTIVE</span>' : '<span style="color:#ef4444;">● HIDDEN</span>'}<br>
        <span>${b.username} • Fee ${b.fee}% • Min $${b.min_investment} • Investors ${b.investors} • Win ${b.win_rate}% • Return ${b.return_6m} • Provider: ${b.provider_id_code}</span><br>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:10px;">
          <button class="btn-edit" onclick="editBot('${b.id}')">✏️ Edit</button>
          <button class="btn-toggle" onclick="toggleBot('${b.id}', ${!b.is_active})">${b.is_active ? 'Hide' : 'Show'}</button>
          <button class="btn-del" onclick="deleteBot('${b.id}')">🗑️ Delete</button>
        </div>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('botList').innerHTML = "JS Error: "+e.message;
    showDebug("JS Error: "+e.message);
  }
}

// ===== CONNECTED USERS - DISCONNECT + AUTO CHECK BALANCE $0 =====
async function loadConnections(){
  try{
    const { data, error } = await sb.from('bot_connections').select('*').eq('status','active').order('created_at', {ascending:false});
    if(error){
      document.getElementById('connList').innerHTML = "No connections table yet. Run the SQL I gave you, then reload. Error: " + error.message;
      document.getElementById('connCount').textContent = '0';
      return;
    }
    if(!data.length){
      document.getElementById('connCount').textContent = '0';
      document.getElementById('connList').innerHTML = "No users connected to any bot yet.";
      return;
    }
    // FIX: If Admin reset balance to $0, auto-disconnect here too.
    // Before, only user phone checked this. Now Admin checks by itself.
    let stillConnected = [];
    let autoDisconnected = 0;
    for(let c of data){
      let total = Number(c.amount || 0);
      // Check REAL live balance from balances table, not the old amount saved at connect time
      try{
        const { data: rows } = await sb.from('balances').select('amount').eq('user_id', c.user_id);
        if(rows){
          total = 0;
          rows.forEach(r=>{ total += Number(r.amount || 0); });
        }
      }catch(e){}
      if(total === 0){
        // Balance $0 -> auto disconnect for Admin side too
        await sb.from('bot_connections').update({ status: 'disconnected' }).eq('id', c.id);
        autoDisconnected++;
      } else {
        // Update displayed amount to live balance so Admin sees real money
        c.amount = total;
        stillConnected.push(c);
      }
    }
    document.getElementById('connCount').textContent = stillConnected.length;
    if(!stillConnected.length){
      document.getElementById('connList').innerHTML = autoDisconnected ? "No users connected to any bot yet. (" + autoDisconnected + " auto-disconnected because balance is $0)" : "No users connected to any bot yet.";
      return;
    }
    document.getElementById('connList').innerHTML = (autoDisconnected ? `<p style="color:#94a3b8;font-size:12px;">${autoDisconnected} user(s) auto-disconnected - balance $0</p>` : '') + stillConnected.map(c => `
      <div class="bot-item">
        <b>${c.bot_name || 'Bot'}</b> <span style="color:#22c55e;">● CONNECTED</span><br>
        <span>User: ${c.user_id || '-'}<br>${c.user_email ? 'Email: ' + c.user_email + '<br>' : ''}Amount: $${Number(c.amount || 0).toFixed(2)} • Connected: ${new Date(c.created_at).toLocaleString()}</span><br>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px;">
          <button class="btn-edit" onclick="copyConnUser('${c.user_id}')">📋 Copy User ID</button>
          <button class="btn-del" type="button" data-disconnect="${c.id}">🔌 Disconnect</button>
        </div>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('connList').innerHTML = "JS Error: "+e.message;
  }
}

async function disconnectUser(connId){
  const btn = document.querySelector('[data-disconnect="'+connId+'"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Disconnecting...'; }
  const { error } = await sb.from('bot_connections').update({ status: 'disconnected' }).eq('id', connId);
  if(error){ alert("Disconnect failed: " + error.message); if(btn){ btn.disabled = false; btn.textContent = '🔌 Disconnect'; } return; }
  loadConnections();
}

function copyConnUser(uid){
  navigator.clipboard.writeText(uid);
  alert('Copied: ' + uid);
}

async function manualDisconnect(){
  const uid = document.getElementById('manualUserId').value.trim();
  const botId = document.getElementById('manualBotId').value.trim();
  const msg = document.getElementById('manualMsg');
  if(!uid){ alert('Paste User ID first'); return; }
  let q = sb.from('bot_connections').update({ status: 'disconnected' }).eq('user_id', uid).eq('status','active');
  if(botId) q = q.eq('bot_id', botId);
  const { error, data } = await q.select();
  if(error){ alert("Disconnect failed: " + error.message); return; }
  msg.textContent = '✓ Disconnected ' + (data ? data.length : 0) + ' connection(s)';
  msg.style.display = 'block';
  setTimeout(()=> msg.style.display='none', 3000);
  document.getElementById('manualUserId').value = '';
  document.getElementById('manualBotId').value = '';
  loadConnections();
}

// Global click - no onclick stiff wahala for Disconnect
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-disconnect]');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  disconnectUser(btn.getAttribute('data-disconnect'));
});

async function editBot(id){
  const { data } = await sb.from('bots').select('*').eq('id', id).single();
  document.getElementById('editId').value = data.id;
  document.getElementById('formTitle').textContent = "✏️ Editing: " + data.name;
  document.getElementById('f_name').value = data.name || '';
  document.getElementById('f_username').value = data.username || '';
  document.getElementById('f_badge').value = data.badge || '';
  document.getElementById('f_description').value = data.description || '';
  document.getElementById('f_fee').value = data.fee || 0;
  document.getElementById('f_investors').value = data.investors || 0;
  document.getElementById('f_drawdown').value = data.max_drawdown || '';
  document.getElementById('f_risk').value = data.risk || '';
  document.getElementById('f_own').value = data.own_funds || 0;
  document.getElementById('f_min').value = data.min_investment || 0;
  document.getElementById('f_total').value = data.total_invested || 0;
  document.getElementById('f_return').value = data.return_6m || '';
  document.getElementById('f_win').value = data.win_rate || 0;
  document.getElementById('f_followers').value = data.followers || 0;
  document.getElementById('f_provider').value = data.provider_id_code || '';
  document.getElementById('f_active').value = String(data.is_active);
  window.scrollTo({top:0, behavior:'smooth'});
}

async function saveBot(){
  const id = document.getElementById('editId').value;
  const payload = {
    name: document.getElementById('f_name').value.trim(),
    username: document.getElementById('f_username').value.trim(),
    badge: document.getElementById('f_badge').value.trim(),
    description: document.getElementById('f_description').value.trim(),
    fee: Number(document.getElementById('f_fee').value),
    investors: Number(document.getElementById('f_investors').value),
    max_drawdown: document.getElementById('f_drawdown').value.trim(),
    risk: document.getElementById('f_risk').value.trim(),
    own_funds: Number(document.getElementById('f_own').value),
    min_investment: Number(document.getElementById('f_min').value),
    total_invested: Number(document.getElementById('f_total').value),
    return_6m: document.getElementById('f_return').value.trim(),
    win_rate: Number(document.getElementById('f_win').value),
    followers: Number(document.getElementById('f_followers').value),
    provider_id_code: document.getElementById('f_provider').value.trim(),
    is_active: document.getElementById('f_active').value === 'true'
  };
  if(!payload.name || !payload.provider_id_code){ alert("Bot Name and Provider ID Code are required"); return; }
  let res;
  if(id){ res = await sb.from('bots').update(payload).eq('id', id); }
  else { res = await sb.from('bots').insert([payload]); }
  if(res.error){ alert("Error: "+res.error.message); showDebug("Save Error: "+res.error.message); return; }
  document.getElementById('saveMsg').style.display = 'block';
  setTimeout(()=> document.getElementById('saveMsg').style.display='none', 2000);
  clearForm(); loadBots();
}

function clearForm(){
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = "+ Add New Bot";
  document.getElementById('f_name').value = '';
  document.getElementById('f_username').value = '';
  document.getElementById('f_badge').value = '';
  document.getElementById('f_description').value = '';
  document.getElementById('f_fee').value = 5;
  document.getElementById('f_investors').value = 0;
  document.getElementById('f_drawdown').value = '';
  document.getElementById('f_risk').value = '';
  document.getElementById('f_own').value = 0;
  document.getElementById('f_min').value = 50;
  document.getElementById('f_total').value = 0;
  document.getElementById('f_return').value = '';
  document.getElementById('f_win').value = 0;
  document.getElementById('f_followers').value = 0;
  document.getElementById('f_provider').value = '';
}

async function deleteBot(id){
  if(!confirm("Delete this bot?")) return;
  await sb.from('bots').delete().eq('id', id);
  loadBots();
}

async function toggleBot(id, newVal){
  await sb.from('bots').update({is_active: newVal}).eq('id', id);
  loadBots();
}
</script>
</body>
</html>
