<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#151515;padding:35px 25px;border-radius:20px;width:90%;max-width:380px}
h2{text-align:center;font-size:28px;margin:0 0 10px 0}
.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:20px}
input{width:100%;padding:13px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:12px;box-sizing:border-box}
.check{font-size:12px;color:#aaa;margin:10px 0 20px 0}
.check a{color:#F5A623}
.btn{width:100%;padding:14px;background:#F5A623;border:none;border-radius:10px;font-weight:700;font-size:16px}
.bottom{margin-top:20px;font-size:13px;color:#aaa;text-align:center}
.bottom a{color:#F5A623}
</style>
</head>
<body>
<div class="card">
  <h2>Create your account</h2>
  <div class="sub">Join Blackrock to manage investments securely</div>
  <input type="text" placeholder="Full name">
  <input type="email" placeholder="Email address">
  <input type="password" placeholder="Create a password">
  <input type="password" placeholder="Confirm your password">
  <div class="check"><input type="checkbox" style="width:auto"> I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></div>
  <button class="btn">Sign up</button>
  <div class="bottom">Already have an account? <a href="login.html">Log in</a></div>
</div>
</body>
</html>
