<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deposit Ethereum</title>
  <link rel="stylesheet" href="Css/ALL_DEP.css" />
  
  <style>
  html, body {
    margin: 0; padding: 0;
    min-height: 100dvh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container, .signup_container, .card {
    margin: auto !important;
    width: 100%;
  }
</style>
  
</head>
<body>
  <div class="container">
    <div class="back" style="margin-right: 280px; margin-top: -80px; margin-bottom: 35px;">
      <a class="b_ack" href="coin_options.html">back</a>
    </div>

    <h2 style="text-align:center;">Deposit Ethereum</h2>
    <p style="text-align:center; color:#facc15; font-size:12px;">Ethereum (ERC20) Network ONLY</p>

    <div style="background:#111a2e; padding:16px; border-radius:14px; margin-top:12px; text-align:center;">
      
      <div style="background:#fff; padding:10px; border-radius:12px; display:inline-block;">
        <img id="depositQR" src="" style="width:160px; height:160px; display:block;">
      </div>

      <!-- PLACE 1 -->
      <div id="depositAddress" style="background:#0a0f1e; border:1px solid #26314d; border-radius:10px; padding:12px; margin:14px 0; word-break:break-all; color:#fff; font-size:14px;">
        0x9921B47780F92e9fEFCb662E318b66E37991848e
      </div>

      <button onclick="copyDepositAddress()" style="background:#1e293b; color:#fff; border:none; padding:12px 20px; border-radius:20px; font-weight:700; width:100%; cursor:pointer;">
        📋 Copy Address
      </button>

      <p style="color:#FFB800; font-size:12px; margin-top:12px;">⚠️ Send ONLY ETH on Ethereum Network. Sending another coin or network will lose your funds.</p>
      
      <!-- ONLY THIS BUTTON CHANGE -->
      <button onclick="messageSupport()" style="background:#facc15; color:#000; border:none; padding:12px; border-radius:10px; font-weight:700; width:100%; margin-top:8px;">I Have Sent</button>
      <p id="copyToast" style="display:none; color:#22c55e; font-size:13px; font-weight:700; margin-top:10px;">✓ Address Copied!</p>
    </div>
  </div>

<script>
// PLACE 2 - THIS IS THE ONE THAT CONTROLS THE PAGE
// Go to Cake Wallet -> Receive -> Ethereum -> Tap Copy -> Paste here
const ETH_ADDRESS = "0x9921B47780F92e9fEFCb662E318b66E37991848e";

document.getElementById('depositAddress').textContent = ETH_ADDRESS;
document.getElementById('depositQR').src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + ETH_ADDRESS;

async function copyDepositAddress(){
  const addr = document.getElementById('depositAddress').textContent.trim();
  try { await navigator.clipboard.writeText(addr); } catch(e) {
    const ta = document.createElement('textarea'); ta.value = addr;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }
  const toast = document.getElementById('copyToast');
  toast.style.display = 'block';
  setTimeout(()=>{ toast.style.display = 'none'; }, 2000);
}

// NEW - ONLY THIS FUNCTION ADDED
function messageSupport(){
  let msg = "Hello, I have paid to your ETH address " + ETH_ADDRESS + " on Ethereum (ERC20). Please confirm my deposit.";
  if(window.smartsupp){ smartsupp('chat:open'); }
  let tries = 0;
  let timer = setInterval(()=>{
    tries++;
    try{
      if(window.smartsupp){ smartsupp('chat:message', msg); clearInterval(timer); }
    }catch(e){}
    if(tries > 5) clearInterval(timer);
  }, 800);
}
</script>

<!-- SMARTSUPP - NEEDED FOR SUPPORT TO OPEN -->
<script type="text/javascript">
var _smartsupp = _smartsupp || {};
_smartsupp.key = '0cf6e2f2863569a9a32db14a2d7ecc78646db70c';
window.smartsupp||(function(d) {
  var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
  s=d.getElementsByTagName('script')[0];c=d.createElement('script');
  c.type='text/javascript';c.charset='utf-8';c.async=true;
  c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
})(document);
</script>
</body>
</html>
