<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; background:#000; color:#fff; font-family: -apple-system, sans-serif; display:flex; justify-content:center; align-items:center; height: 100vh; text-align:center; }
.container { width:90%; max-width:400px; border: 1px solid gray}
h1 { font-size:52px; font-weight:900; line-height:0.95; text-transform:lowercase; margin-bottom:20px; letter-spacing:-1px; }
p { color:#888; font-size:14px; letter-spacing:1px; margin-bottom:40px; }
.divider { height:1px; background:#fff; width:50%; margin:0 auto 40px auto; }
.btns { display:flex; gap:12px; justify-content:center; }
.btn { padding:12px 28px; border-radius:30px; font-size:14px; text-decoration:none; display:inline-block; }
.login { border:1px solid #fff; color:#fff; }
.signup { background:#F5A623; color:#000; font-weight:600; }
</style>
</head>
<body>
<div class="container">
  <h1>welcome to blackrock</h1>
  <p>earn $100 in minutes -- $5,000 and more reward awaits.</p>
  <div class="divider"></div>
  <div class="btns">
    <a href="login.html" class="btn login">login</a>
    <a href="signup.html" class="btn signup">signup</a>
  </div>
</div>
</body>
</html>
